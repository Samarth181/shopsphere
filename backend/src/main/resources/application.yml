server:
  port: ${SERVER_PORT:${PORT:8080}}

spring:
  application:
    name: shopsphere-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:shopsphere}
    password: ${DB_PASSWORD:shopsphere_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  jackson:
    default-property-inclusion: non_null

shopsphere:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    root: INFO
    com.shopsphere: INFO
